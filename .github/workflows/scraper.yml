name: Run ER Scraper Every 3 Hours

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Test CKAN API
        run: |
          python -c "
          import requests
          r = requests.get('https://www.donneesquebec.ca/api/3/action/datastore_search?resource_id=b256f87f-40ec-4c79-bdba-a23e9c50e741&limit=5', headers={'User-Agent': 'Mozilla/5.0'})
          print('Status:', r.status_code)
          print('Success:', 'success' in r.text)
          "
      
      - name: Run scraper
        run: python scraper.py

      - name: Show files after scrape
        run: ls -la

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git status
          git commit -m "Update ER data" || echo "No changes to commit"
          git pull --rebase origin main
          git push
