name: MyVita Clinic Scraper

on:
  workflow_dispatch:
    inputs:
      postal_code:
        description: 'Postal code'
        required: true
      first_name:
        description: 'First name'
        required: false
        default: ''
      last_name:
        description: 'Last name'
        required: false
        default: ''
      phone:
        description: 'Phone'
        required: false
        default: ''
      ramq:
        description: 'RAMQ number'
        required: false
        default: ''
      ramq_seq:
        description: 'RAMQ sequence'
        required: false
        default: '01'
      email:
        description: 'Email'
        required: false
        default: ''
      birth_date:
        description: 'Date of birth (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Install dependencies
        run: |
          pip install playwright firebase-admin requests
          playwright install chromium
          playwright install-deps chromium

      - name: Run clinic scraper
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          POSTAL_CODE: ${{ github.event.inputs.postal_code }}
          USER_FIRST_NAME: ${{ github.event.inputs.first_name }}
          USER_LAST_NAME: ${{ github.event.inputs.last_name }}
          USER_PHONE: ${{ github.event.inputs.phone }}
          USER_RAMQ: ${{ github.event.inputs.ramq }}
          USER_RAMQ_SEQ: ${{ github.event.inputs.ramq_seq }}
          USER_EMAIL: ${{ github.event.inputs.email }}
          USER_BIRTH_DATE: ${{ github.event.inputs.birth_date }}
        run: python clinic_scraper.py
