name: Medication Shortages Sync

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6:00 AM UTC (2:00 AM EST)
  workflow_dispatch:

jobs:
  sync-shortages:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install firebase-admin
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium
      
      - name: Run medication shortages sync
        env:
          MYVITA_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.MYVITA_FIREBASE_SERVICE_ACCOUNT }}
          DRUG_SHORTAGES_EMAIL: ${{ secrets.DRUG_SHORTAGES_EMAIL }}
          DRUG_SHORTAGES_PASSWORD: ${{ secrets.DRUG_SHORTAGES_PASSWORD }}
        run: |
          python medication_shortages_sync.py
      
      - name: Log completion
        if: always()
        run: |
          echo "Medication shortages sync completed at $(date -u)"
