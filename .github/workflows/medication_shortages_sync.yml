name: Medication Shortages Sync

on:
  schedule:
    - cron: '0 */12 * * *'  # Every 12 hours
  workflow_dispatch:

jobs:
  sync-shortages:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install firebase-admin
      
      - name: Run medication shortages sync
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.MYVITA_FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python medication_shortages_sync.py
