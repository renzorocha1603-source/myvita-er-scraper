name: Clic Santé Slot Checker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      postal_code:
        description: 'Postal code (optional — reads from Firestore if not provided)'
        required: false
        type: string
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install playwright requests firebase-admin
          playwright install chromium --with-deps
      
      - name: Run Bot
        env:
          POSTAL_CODE: ${{ github.event.inputs.postal_code }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: python bot.py
