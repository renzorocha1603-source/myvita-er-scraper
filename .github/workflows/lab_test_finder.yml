name: Clic Santé Slot Checker

on:
  workflow_dispatch:
    inputs:
      postal_code:
        description: 'Postal code to search'
        required: true
        type: string
        default: 'H1Y3H1'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install playwright requests firebase-admin
          playwright install chromium --with-deps
      
      - name: Run Bot
        env:
          POSTAL_CODE: ${{ github.event.inputs.postal_code }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: python bot.py
