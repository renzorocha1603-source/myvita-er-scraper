name: Lab Test Finder (Manual Test)

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Run lab test finder
        run: python lab_test_finder.py
      
      - name: Show results
        run: cat lab_booking_test.json
      
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add lab_booking_test.json
          git diff --staged --quiet || git commit -m "Update lab booking test results"
          git push
