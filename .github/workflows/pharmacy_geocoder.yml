name: Pharmacy Geocoder (Manual)

on:
  workflow_dispatch:

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run geocoder
        run: python pharmacy_geocoder.py
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pharmacies_with_coords.json
          git commit -m "Update pharmacy coordinates" || echo "No changes"
          git push
